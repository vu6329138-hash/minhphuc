<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng 20/10 - Minh Phúc 🌷</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        /* Gift Box Screen */
        .gift-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .gift-wrapper:hover {
            transform: scale(1.08);
        }
        .gift-box {
            font-size: 7rem;
            animation: bounce 1.5s infinite ease-in-out;
            filter: drop-shadow(0 15px 25px rgba(214, 40, 40, 0.4));
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }
        .click-hint {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #d62828;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        /* Card Display */
        .card {
            display: none;
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 35px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(214, 40, 40, 0.35);
            border: 4px solid #ffffff;
            backdrop-filter: blur(15px);
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .icon-top {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }
        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: #d62828;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(214, 40, 40, 0.2);
        }
        .name {
            font-size: 1.6rem;
            color: #ff0054;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .message {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.8;
            font-weight: 600;
            min-height: 90px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Hộp quà tương tác -->
    <div class="gift-wrapper" id="gift" onclick="openCard()">
        <div class="gift-box">🎁</div>
        <div class="click-hint">Chạm vào hộp quà nhé! 🌷</div>
    </div>

    <!-- Thiệp chúc mừng -->
    <div class="card" id="card">
        <div class="icon-top">🌷💖✨</div>
        <h1>Happy 20/10!</h1>
        <div class="name">Minh Phúc</div>
        <div class="message" id="typed-text"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let hearts = [];
        let fireworks = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class FallingHeart {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = Math.random() * 20 + 12;
                this.speedY = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.opacity = Math.random() * 0.5 + 0.5;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height + 20) this.reset();
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px Arial`;
                ctx.fillText('💖', this.x, this.y);
            }
        }

        class FireworkParticle {
            constructor(x, y) {
                this.x = x; this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.color = ['#ff0054', '#ff4d6d', '#ffb703', '#ffffff'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) hearts.push(new FallingHeart());

        function explode(x, y) {
            for (let i = 0; i < 80; i++) fireworks.push(new FireworkParticle(x, y));
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            hearts.forEach(h => { h.update(); h.draw(); });
            fireworks.forEach((f, index) => {
                f.update(); f.draw();
                if (f.alpha <= 0) fireworks.splice(index, 1);
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Mở thiệp & Hiệu ứng gõ chữ
        const fullMessage = "Chúc Minh Phúc ngày 20/10 luôn tràn ngập nụ cười, siêu nhiều may mắn, nhận thật nhiều quà và lúc nào cũng đáng yêu thế này nha! ✨💖";
        let charIndex = 0;

        function openCard() {
            document.getElementById('gift').style.display = 'none';
            document.getElementById('card').style.display = 'block';
            
            // Nổ pháo hoa mừng
            explode(width / 2, height / 2);
            setInterval(() => {
                explode(Math.random() * width, Math.random() * (height * 0.7));
            }, 1000);

            // Chạy chữ gõ từ từ
            function typeText() {
                if (charIndex < fullMessage.length) {
                    document.getElementById('typed-text').innerHTML += fullMessage.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeText, 40);
                }
            }
            typeText();
        }
    </script>
</body>
</html>
